name: Android CI/CD

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android App
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Build Tools 36.0.0
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'

      - name: Install Android 17 Preview SDK (API 37.0) via Preview Channel
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable not found in $ANDROID_HOME/cmdline-tools/latest/bin/ or $ANDROID_HOME/tools/bin/"
            exit 1
          fi

          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          yes | "$SDKMANAGER" --channel=3 "platforms;android-37.0"

      - name: Verify Android 37 Platform & android.jar
        run: |
          set -e
          echo "Checking installed Android SDK platforms in $ANDROID_HOME/platforms..."
          ls -la "$ANDROID_HOME/platforms"
          
          PLATFORM_DIR=""
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            PLATFORM_DIR="$ANDROID_HOME/platforms/android-37.0"
          elif [ -d "$ANDROID_HOME/platforms/android-37" ]; then
            PLATFORM_DIR="$ANDROID_HOME/platforms/android-37"
          fi

          if [ -z "$PLATFORM_DIR" ] || [ ! -f "$PLATFORM_DIR/android.jar" ]; then
            echo "::error::Android 37 Platform or android.jar missing in $ANDROID_HOME/platforms!"
            exit 1
          fi

          echo "Verified Android 37 Platform and android.jar at: $PLATFORM_DIR/android.jar"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Validate Required GitHub Secrets
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          MISSING_SECRETS=0
          if [ -z "$GEMINI_KEY" ]; then
            echo "::error::Missing GEMINI_API_KEY secret in GitHub Repository Secrets!"
            MISSING_SECRETS=1
          fi
          if [ -z "$MAPS_KEY" ]; then
            echo "::error::Missing MAPS_API_KEY secret in GitHub Repository Secrets!"
            MISSING_SECRETS=1
          fi
          if [ -z "$GOOGLE_SERVICES" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON secret in GitHub Repository Secrets!"
            MISSING_SECRETS=1
          fi

          if [ $MISSING_SECRETS -eq 1 ]; then
            echo "::error::Build aborted due to missing required secrets."
            exit 1
          fi

      - name: Restore local.properties from GitHub Secrets
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
          printf "GEMINI_API_KEY=%s\n" "$GEMINI_KEY" >> local.properties
          printf "MAPS_API_KEY=%s\n" "$MAPS_KEY" >> local.properties

      - name: Restore google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf "%s" "$GOOGLE_SERVICES_CONTENT" > app/google-services.json

      - name: Run Unit Tests & Build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalInsights-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
